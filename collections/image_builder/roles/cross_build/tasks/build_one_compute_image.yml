#
# Build a single aarch64 compute image for one functional group.
# Called in a loop from build_compute_images.yml.
---

- name: "Set compute image vars for {{ fg_item.key }}"
  ansible.builtin.set_fact:
    _fg_name: "{{ fg_item.key }}"
    _fg_packages: "{{ fg_item.value.packages }}"
    _fg_functional_group: "{{ fg_item.value.functional_group }}"
    _fg_k8s_sfx: "{{ (fg_item.key is match('service_kube_')) | ternary(k8s_suffix, '') }}"

- name: "Set compute image name for {{ _fg_name }}"
  ansible.builtin.set_fact:
    _compute_image_name: "rhel-{{ _fg_name }}{{ image_suffix | default('') }}{{ _fg_k8s_sfx }}{{ compute_image_suffix | default('') }}"
    _compute_installroot: "{{ cross_build_root }}/compute/{{ _fg_name }}"

- name: "Create log file for {{ _fg_name }}"
  ansible.builtin.file:
    path: "{{ build_log_dir }}/cross_build_{{ _fg_name }}_compute.log"
    state: touch
    mode: "{{ dir_permissions_644 }}"

- name: "Clean installroot for {{ _fg_name }}"
  ansible.builtin.file:
    path: "{{ _compute_installroot }}"
    state: absent

- name: "Create installroot for {{ _fg_name }}"
  ansible.builtin.file:
    path: "{{ _compute_installroot }}"
    state: directory
    mode: "{{ dir_permissions_755 }}"

# ── Phase 1: Native dnf install of compute packages ────────────────────

- name: "Phase 1: Install aarch64 compute packages for {{ _fg_name }} (containerized)"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      podman run --rm --network host \
        -v {{ cross_build_root }}:/build:z \
        -v {{ _compute_installroot }}:/build/compute/{{ _fg_name }}:z \
        -v {{ build_log_dir }}:/logs:z \
        {{ _dnf_container_image }} \
        /bin/bash -c '
          rm -f /etc/yum.repos.d/*.repo 2>/dev/null; cp /build/aarch64-repos.repo /etc/yum.repos.d/aarch64-repos.repo
          dnf clean all 2>/dev/null || true
          HOST_CFG=""; dnf --help 2>&1 | grep -q "use-host-config" && HOST_CFG="--use-host-config"
          dnf install -y \
            --forcearch=aarch64 \
            --installroot=/build/compute/{{ _fg_name }} $HOST_CFG \
            --setopt=cachedir=/build/dnf-cache \
            --setopt=install_weak_deps=False {{ '' if gpg_check | default(true) | bool else '--nogpgcheck' }} \
            --setopt=tsflags=nodocs \
            --releasever={{ os_version }} \
            {{ _fg_packages | join(" ") }} \
            2>&1 | tee -a /logs/cross_build_{{ _fg_name }}_compute.log
        '
    executable: /bin/bash
  register: dnf_compute_result
  changed_when: true
  when: _fg_packages | length > 0

# ── Phase 2: buildah layer on base + minimal emulated commands ─────────

- name: "Phase 2: Assemble compute image for {{ _fg_name }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail

      # Start from the base aarch64 image we already built (local or registry)
      {% if registry_url | default('') | length > 0 %}
      BASE_REF="docker://{{ registry_url }}/{{ registry_ns }}/{{ base_image_name }}:{{ os_version }}"
      {% else %}
      BASE_REF="localhost/{{ registry_ns }}/{{ base_image_name }}:{{ os_version }}"
      {% endif %}
      CTR=$(buildah from --arch arm64 {{ '--tls-verify=false' if not (registry_tls_verify | default(false) | bool) else '' }} "$BASE_REF")
      echo "Container: $CTR (from base $BASE_REF)"

      {% if _fg_packages | length > 0 %}
      # Layer compute packages (tar preserves symlinks)
      tar -C {{ _compute_installroot }} -cf /tmp/_compute_layer.tar .
      buildah add "$CTR" /tmp/_compute_layer.tar /
      rm -f /tmp/_compute_layer.tar
      {% endif %}

      # Run per-functional-group post-install commands under QEMU
      {% set command_var = _fg_functional_group + '_compute_commands' %}
      {% set commands_list = lookup('vars', command_var, default=[]) %}
      {% if commands_list | length > 0 %}
      {% for cmd in commands_list %}
      echo "Running emulated: {{ cmd | regex_replace('\"', '\\\"') }}"
      buildah run "$CTR" -- /usr/bin/bash -c '{{ cmd }}'
      {% endfor %}
      {% endif %}

      # Commit locally
      LOCAL_IMG="localhost/{{ registry_ns }}/{{ _compute_image_name }}:{{ os_version }}"
      buildah commit "$CTR" "$LOCAL_IMG"

      {% if registry_url | default('') | length > 0 %}
      # Push to remote registry
      REMOTE_IMG="{{ registry_url }}/{{ registry_ns }}/{{ _compute_image_name }}:{{ os_version }}"
      buildah tag "$LOCAL_IMG" "$REMOTE_IMG"
      buildah push {{ '--tls-verify=false' if not (registry_tls_verify | default(false) | bool) else '' }} "$REMOTE_IMG" "docker://$REMOTE_IMG"
      echo "Pushed to registry: $REMOTE_IMG"
      {% endif %}

      # Cleanup buildah container (image stays)
      buildah rm "$CTR" || true

      echo "=== Compute image built: {{ _compute_image_name }}:{{ os_version }} ==="
    executable: /bin/bash
  register: buildah_compute_result
  changed_when: true
  async: 3600
  poll: 30

- name: "Export {{ _fg_name }} compute image to local output + S3"
  ansible.builtin.include_tasks: "{{ role_path }}/../local_storage/tasks/export_image.yml"
  vars:
    _export_image_name: "localhost/{{ registry_ns }}/{{ _compute_image_name }}:{{ os_version }}"
    _export_group_name: "{{ _fg_name }}"
    _export_label: "{{ _fg_name }} compute image"

- name: "Display result for {{ _fg_name }}"
  ansible.builtin.debug:
    msg:
      - "Cross-build complete: {{ _compute_image_name }}:{{ os_version }}"
      - "Local: {{ output_dir | default(work_dir + '/output') }}/{{ _fg_name }}/"
