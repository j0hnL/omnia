#
# Extract vmlinuz + initramfs from a built image for PXE boot.
# image-thrillhouse handles squashfs export via its publish config,
# but kernel/initramfs extraction needs buildah mount access.
---

- name: "Create PXE artifact directory for {{ _export_label }}"
  ansible.builtin.file:
    path: "{{ output_dir }}/{{ _export_group_name }}"
    state: directory
    mode: "0755"

- name: "Extract kernel and initramfs from {{ _export_label }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      IMG="{{ _export_image_name }}"
      OUT="{{ output_dir }}/{{ _export_group_name }}"
      SQUASHFS_DIR="{{ output_dir }}/base"
      SQUASHFS_NAME="{{ _export_group_name }}-{{ os_version | default('latest') }}.squashfs"
      MOUNT=""

      extract_from_buildah() {
        # Try extracting from OCI image via buildah mount
        if ! buildah images --format '{% raw %}{{.Name}}:{{.Tag}}{% endraw %}' | grep -qF "{{ _export_image_name | regex_replace('^localhost/', '') }}"; then
          return 1
        fi
        CTR=$(buildah from "$IMG")
        trap 'buildah umount "$CTR" 2>/dev/null; buildah rm "$CTR" 2>/dev/null' EXIT
        MOUNT=$(buildah mount "$CTR")
        echo "Mounted $IMG via buildah at $MOUNT"
      }

      extract_from_squashfs() {
        # Fall back to extracting from the squashfs file
        SQ="$SQUASHFS_DIR/$SQUASHFS_NAME"
        if [ ! -f "$SQ" ]; then
          echo "No squashfs found at $SQ, cannot extract PXE artifacts"
          return 1
        fi
        MOUNT=$(mktemp -d)
        trap "umount '$MOUNT' 2>/dev/null; rmdir '$MOUNT' 2>/dev/null" EXIT
        if command -v unsquashfs >/dev/null 2>&1; then
          # unsquashfs doesn't need root — extract only boot/ and lib/modules/
          rmdir "$MOUNT"
          MOUNT=$(mktemp -d)
          unsquashfs -f -d "$MOUNT" "$SQ" 'boot/*' 'lib/modules/*' 2>/dev/null || \
            unsquashfs -f -d "$MOUNT" "$SQ" 2>/dev/null
          echo "Extracted squashfs $SQ to $MOUNT"
        elif mount -t squashfs "$SQ" "$MOUNT" 2>/dev/null; then
          echo "Mounted squashfs $SQ at $MOUNT"
        else
          echo "Cannot mount or extract squashfs (no unsquashfs or mount access)"
          rmdir "$MOUNT" 2>/dev/null
          return 1
        fi
      }

      # Try buildah first, fall back to squashfs
      if ! extract_from_buildah; then
        echo "OCI image not in local storage, falling back to squashfs extraction"
        if ! extract_from_squashfs; then
          echo "WARNING: Could not extract PXE artifacts — squashfs is still available at $SQUASHFS_DIR/$SQUASHFS_NAME"
          exit 0
        fi
      fi

      # Extract kernel
      KVER=$(ls "$MOUNT/lib/modules/" 2>/dev/null | sort -V | tail -1 || true)
      if [ -n "$KVER" ]; then
        # vmlinuz: check /boot (RHEL/Rocky/Alma) then /lib/modules (Fedora 42+)
        if [ -f "$MOUNT/boot/vmlinuz-$KVER" ]; then
          cp "$MOUNT/boot/vmlinuz-$KVER" "$OUT/vmlinuz"
          echo "Exported kernel: /boot/vmlinuz-$KVER"
        elif [ -f "$MOUNT/lib/modules/$KVER/vmlinuz" ]; then
          cp "$MOUNT/lib/modules/$KVER/vmlinuz" "$OUT/vmlinuz"
          echo "Exported kernel: /lib/modules/$KVER/vmlinuz"
        fi

        # initramfs: RHEL uses initramfs-<kver>.img, Debian uses initrd.img-<kver>
        if [ -f "$MOUNT/boot/initramfs-$KVER.img" ]; then
          cp "$MOUNT/boot/initramfs-$KVER.img" "$OUT/initramfs.img"
          echo "Exported initramfs: /boot/initramfs-$KVER.img"
        elif [ -f "$MOUNT/boot/initrd.img-$KVER" ]; then
          cp "$MOUNT/boot/initrd.img-$KVER" "$OUT/initramfs.img"
          echo "Exported initramfs: /boot/initrd.img-$KVER"
        fi
      fi

      # Generate manifest.json
      cd "$OUT"
      checksum() { [ -f "$1" ] && sha256sum "$1" | awk '{print $1}' || echo ""; }
      filesize() { [ -f "$1" ] && stat -c%s "$1" || echo 0; }
      cat > manifest.json <<MANIFEST_EOF
      {
        "image_name": "{{ _export_group_name }}",
        "os_family": "{{ os_family | default('rhel') }}",
        "os_version": "{{ os_version | default('') }}",
        "target_arch": "{{ target_arch | default('x86_64') }}",
        "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
        "source_image": "{{ _export_image_name }}",
        "builder": "image-thrillhouse",
        "files": {
          "rootfs": {
            "size_bytes": $(filesize rootfs 2>/dev/null || echo 0),
            "sha256": "$(checksum rootfs 2>/dev/null)"
          },
          "vmlinuz": {
            "size_bytes": $(filesize vmlinuz),
            "sha256": "$(checksum vmlinuz)"
          },
          "initramfs": {
            "size_bytes": $(filesize initramfs.img),
            "sha256": "$(checksum initramfs.img)"
          }
        }
      }
      MANIFEST_EOF

      sha256sum vmlinuz initramfs.img 2>/dev/null > SHA256SUMS || true

      echo "PXE artifacts exported to $OUT/"
      ls -lh "$OUT/"
    executable: /bin/bash
  register: _pxe_export_result
  changed_when: true
  failed_when: false

- name: "Display PXE export result for {{ _export_label }}"
  ansible.builtin.debug:
    msg:
      - "PXE artifacts: {{ output_dir }}/{{ _export_group_name }}/"
      - "{{ _pxe_export_result.stdout_lines | last | default('(no output)') }}"
