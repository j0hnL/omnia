---

- name: Fetch base and compute image packages
  block:
    - name: Collect base image RPM packages (default + additional + admin_debug)
      omnia.open_image_builder.base_image_package_collector:
        default_json_path: "{{ default_json_path }}"
        additional_json_path: "{{ additional_json_path | default('') }}"
        admin_debug_json_path: "{{ admin_debug_json_path | default('') }}"
        software_config_path: "{{ software_config_file_path }}"
      register: base_image_output

    - name: Set base_image_packages fact
      ansible.builtin.set_fact:
        base_image_packages: "{{ base_image_output.base_image_packages }}"

    - name: Debug base_image_packages
      ansible.builtin.debug:
        var: base_image_packages
        verbosity: 2

    - name: Parse functional_group_config.yml to list
      omnia.open_image_builder.functional_group_parser:
        functional_groups_file: "{{ functional_groups_config_path }}"
      register: functional_group_parser_list
      when: not enable_build_stream | default(false) | bool

    - name: Set fact for functional_group_list
      ansible.builtin.set_fact:
        functional_group_list: "{{ functional_group_parser_list.functional_groups }}"
      when: not enable_build_stream | default(false) | bool

    - name: Debug functional group list
      ansible.builtin.debug:
        var: functional_group_list
        verbosity: 2

    - name: Read packages for compute image softwares
      omnia.open_image_builder.image_package_collector:
        functional_groups: "{{ functional_group_list }}"
        software_config_file: "{{ software_config_file_path }}"
        input_project_dir: "{{ input_project_dir }}"
        additional_json_path: "{{ additional_json_path }}"
      register: compute_images_output

    - name: Filter compute_images_dict for target architecture
      ansible.builtin.set_fact:
        compute_images_dict: >-
          {{
            compute_images_output.compute_images_dict
            | dict2items
            | selectattr('key', 'search', '_' + target_arch + '$')
            | items2dict
          }}

    - name: Extract service_k8s_version from software_config.json
      ansible.builtin.set_fact:
        service_k8s_version: >-
          {{ (lookup('file', software_config_file_path) | from_json).softwares
             | selectattr('name', 'equalto', 'service_k8s')
             | map(attribute='version') | first | default('') }}

    - name: Debug compute_images_dict
      ansible.builtin.debug:
        var: compute_images_dict
        verbosity: 2
