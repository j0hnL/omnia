---
galaxy_info:
  role_name: config_gen
  author: Dell Omnia Team
  description: >
    Generate image-thrillhouse YAML configs from Omnia variables.
    Translates base_image_packages, compute_images_dict, and repos into
    the image-thrillhouse config format (meta/layer/publish schema).
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: ["9", "10"]
    - name: Fedora
      versions: ["41", "42"]
    - name: Ubuntu
      versions: ["22.04", "24.04"]
    - name: Debian
      versions: ["11", "12"]
dependencies: []
