# Generate image-thrillhouse YAML config for the base image.
---

- name: Set base image name
  ansible.builtin.set_fact:
    _base_image_name: "{{ base_image_name }}"

- name: Set post-install commands for base image
  ansible.builtin.set_fact:
    _post_install_cmds: >-
      {{ [_dracut_script | regex_replace('\n', ' && ')] if _pkg_manager == 'dnf'
         else [_initramfs_script | regex_replace('\n', ' && ')] if _pkg_manager == 'mmdebstrap'
         else [] }}

- name: Generate base image config
  ansible.builtin.template:
    src: "base-config.yaml.j2"
    dest: "{{ config_output_dir }}/base.yaml"
    mode: "{{ dir_permissions_644 }}"
  vars:
    _repos: "{{ repos }}"
    _packages: "{{ base_image_packages }}"
    _config_path: "{{ config_output_dir }}/base.yaml"

- name: Display base config path
  ansible.builtin.debug:
    msg:
      - "Generated: {{ config_output_dir }}/base.yaml"
      - "Image: {{ _base_image_name }}:{{ os_version }}"
      - "Packages: {{ base_image_packages | length }}"
      - "Repos: {{ repos | map(attribute='name') | list }}"
