#
# Write a build manifest listing all generated configs in build order.
# The build role reads this to know what to build and in what order.
---

- name: Build the manifest config list
  ansible.builtin.set_fact:
    _build_configs:
      - name: "{{ base_image_name }}"
        config: "{{ config_output_dir }}/base.yaml"
        type: base
        arch: "{{ target_arch }}"

- name: Add compute configs to manifest
  ansible.builtin.set_fact:
    _build_configs: >-
      {{ _build_configs + [{
        'name': os_family + '-' + item.key + (image_name_suffix | default('')),
        'config': config_output_dir + '/' + item.key + '.yaml',
        'type': 'compute',
        'arch': target_arch,
        'functional_group': item.value.functional_group
      }] }}
  loop: "{{ compute_images_dict | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Write build manifest
  ansible.builtin.copy:
    content: |
      # Auto-generated build manifest — omnia.image_builder config_gen
      # Build order matters: base image first, then compute images.
      ---
      os_family: "{{ os_family | default('rhel') }}"
      os_version: "{{ os_version }}"
      target_arch: "{{ target_arch }}"
      base_image_name: "{{ base_image_name }}"
      configs:
      {{ _build_configs | to_nice_yaml(indent=2) | indent(2, false) }}
    dest: "{{ config_output_dir }}/build_manifest.yml"
    mode: "{{ dir_permissions_644 }}"

- name: Display build manifest summary
  ansible.builtin.debug:
    msg:
      - "Build manifest: {{ config_output_dir }}/build_manifest.yml"
      - "Total configs: {{ _build_configs | length }} (1 base + {{ compute_images_dict | default({}) | length }} compute)"
      - "Architecture: {{ target_arch }}"
