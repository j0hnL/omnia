apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-builder
  namespace: image-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-builder
  namespace: image-builder
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-builder
  namespace: image-builder
subjects:
  - kind: ServiceAccount
    name: image-builder
roleRef:
  kind: Role
  name: image-builder
  apiGroup: rbac.authorization.k8s.io
