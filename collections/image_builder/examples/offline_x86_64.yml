# Example: Fully offline x86_64 image build with local repo mirror
#
# This creates a local RPM mirror so no external network access is
# needed during image builds. Run once while online to cache packages,
# then rebuild offline as many times as needed.
#
# Usage:
#   # First run (downloads packages from upstream, then builds):
#   ansible-playbook omnia.image_builder.build_x86_64 \
#     -e @examples/offline_x86_64.yml
#
#   # Subsequent runs (fully offline — uses cached mirror):
#   ansible-playbook omnia.image_builder.build_x86_64 \
#     -e @examples/offline_x86_64.yml
#   (skip_if_cached=true by default, so it won't try to download again)
---

# Enable local mirror
use_local_mirror: true

os_family: "rhel"
os_version: "10.0"
target_arch: "x86_64"

# Upstream repos (accessed only during first sync)
upstream_repos:
  - name: "baseos"
    base_url: "https://repo.almalinux.org/almalinux/10/BaseOS/x86_64/os"
    gpg: ""
  - name: "appstream"
    base_url: "https://repo.almalinux.org/almalinux/10/AppStream/x86_64/os"
    gpg: ""

# Packages for the base image
base_image_packages:
  - kernel
  - dracut
  - dracut-live
  - dracut-network
  - NetworkManager
  - openssh-server
  - openssh-clients
  - chrony
  - sudo
  - iproute
  - iputils
  - vim-minimal
  - less
  - tar
  - gzip

# These are also downloaded into the mirror
mirror_packages:
  - kernel
  - dracut
  - dracut-live
  - dracut-network
  - NetworkManager
  - openssh-server
  - openssh-clients
  - chrony
  - sudo
  - iproute
  - iputils
  - vim-minimal
  - less
  - tar
  - gzip
  # Add compute-specific packages here too (requires EPEL for slurm):
  # - slurm
  # - slurm-slurmd
  # - munge
  # - hwloc

mirror_package_groups:
  - "Minimal Install"
  - "Development Tools"

# Compute images (optional — uncomment and add EPEL repo for slurm)
# compute_images_dict:
#   slurm_node_x86_64:
#     functional_group: "slurm_node_x86_64"
#     packages:
#       - slurm-slurmd
#       - munge
#       - hwloc

# Build workspace
work_dir: "/var/lib/image-builder"

# Local mirror settings
mirror_dir: "/var/lib/image-builder/repo_mirror"
serve_port: 8080
# skip_if_cached: true   # (default) — skips download on subsequent runs
