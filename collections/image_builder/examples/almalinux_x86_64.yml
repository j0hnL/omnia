# Example: Build AlmaLinux 10 x86_64 images
#
# Usage:
#   ansible-playbook omnia.open_image_builder.build_x86_64 -e @examples/almalinux_x86_64.yml
---

os_family: "almalinux"
os_version: "10.0"
target_arch: "x86_64"

repos:
  - name: "alma-baseos"
    base_url: "https://repo.almalinux.org/almalinux/10/BaseOS/x86_64/os"
    gpg: ""
  - name: "alma-appstream"
    base_url: "https://repo.almalinux.org/almalinux/10/AppStream/x86_64/os"
    gpg: ""

base_image_packages:
  - kernel
  - dracut
  - dracut-live
  - dracut-network
  - NetworkManager
  - openssh-server
  - openssh-clients
  - chrony
  - sudo
  - iproute
  - iputils

work_dir: /var/lib/image-builder
