# Example: Build Fedora 42 x86_64 images
#
# Usage:
#   ansible-playbook omnia.image_builder.build_x86_64 -e @examples/fedora_x86_64.yml
---

os_family: "fedora"
os_version: "42"
target_arch: "x86_64"

repos:
  - name: "fedora"
    base_url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/42/Everything/x86_64/os"
    gpg: ""
  - name: "fedora-updates"
    base_url: "https://dl.fedoraproject.org/pub/fedora/linux/updates/42/Everything/x86_64"
    gpg: ""

base_image_packages:
  - kernel
  - dracut
  - dracut-live
  - dracut-network
  - NetworkManager
  - openssh-server
  - openssh-clients
  - chrony
  - sudo
  - iproute
  - iputils

work_dir: /var/lib/image-builder
