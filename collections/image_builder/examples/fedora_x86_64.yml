# Fedora 44 x86_64 — latest Fedora with development tools
#
# Build:
#   ansible-playbook omnia.open_image_builder.build -e @examples/fedora_x86_64.yml
#
# NOTE: Fedora builds require direct mirror baseurl — Fedora's metalink
# redirection does not work inside build containers. The URLs below use
# dl.fedoraproject.org which is Fedora's primary CDN.
---
os_family: fedora
os_version: "44"
target_arch: x86_64

repos:
  - name: fedora
    base_url: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os
    gpg: ""
  - name: updates
    base_url: https://dl.fedoraproject.org/pub/fedora/linux/updates/44/Everything/x86_64
    gpg: ""

base_image_packages:
  - kernel
  - dracut
  - dracut-live
  - dracut-network
  - NetworkManager
  - openssh-server
  - chrony
  - sudo
  - iproute
  - iputils
