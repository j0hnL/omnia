# ***********************************************************************
# DO NOT REMOVE OR COMMENT OUT ANY LINES IN THIS FILE.
# SIMPLY APPEND THE REQUIRED VALUES AGAINST THE PARAMETER OF YOUR CHOICE.
# ***********************************************************************

#### Mandatory
# This depicts the path where user has kept the PXE mapping file.
# The mapping file consists of the Service tag, Admin MAC,Hostname and its respective admin IP address and/or BMC IP.
# Ensure that admin IPs given in mapping file are within the network defined in the network_spec.yml
# A templates for mapping file exists in omnia/examples, namely, pxe_mapping_file.csv
# Format of csv: FUNCTIONAL_GROUP_NAME,GROUP_NAME,SERVICE_TAG,HOSTNAME,ADMIN_MAC,ADMIN_IP,BMC_MAC,BMC_IP
pxe_mapping_file_path: "/opt/omnia/input/project_default/pxe_mapping_file.csv"

#### Mandatory
# Language that needs to be set during OS provisioning.
# Only language supported is "en_US.UTF-8"
language: "en_US.UTF-8"

#### Mandatory
# Default lease time needs to be used by DHCP
# Unit: seconds
# Min: 21600
# Default: 86400
# Max: 31536000
default_lease_time: "86400"

#### Optional
# Enable DNS-based hostname resolution for compute nodes.
# When true, nodes use coresmd (CoreDNS + OpenCHAMI SMD plugin) instead of /etc/hosts.
# DNS records are generated automatically from SMD inventory.
# The cluster domain is read from OIM metadata (domain_name).
# Default: false
dns_enabled: false

#### Optional
# Pin a specific kernel version for boot image selection.
# The specified version applies to both x86_64 and aarch64 architectures.
# Leave empty ("") to auto-select the latest available image from S3.
# Example: kernel_version_override: "6.12.0-55.76.1.el10_0"
kernel_version_override: ""

#### Optional
# Path to additional cloud-init configuration file for stateless node provisioning.
# The file supports both common (all nodes) and per-functional-group cloud-init sections.
# An example file is provided at omnia/examples/additional_cloud_init.yml
# Leave empty ("") to disable additional cloud-init.
# Default: "" (disabled)
additional_cloud_init_config_file: ""

#### Optional
# Kernel ip= parameter for dracut network boot during PXE provisioning.
# Controls which network interface the kernel uses for rootfs download.
# On servers with multiple NICs where PXE and OS boot use different interfaces,
# set this to "ip=<interface>:dhcp" (e.g. "ip=eno12399np0:dhcp") to force the
# kernel to use the PXE NIC for rootfs download.
# Default: "ip=dhcp" (kernel tries all interfaces)
bss_ip_param: "ip=dhcp"

#### Optional
# Override kernel ip= parameter for compute RKE2 nodes only.
# On multi-NIC servers (e.g. C6620 with Embedded 1GbE + Integrated 25GbE),
# the kernel's ip=dhcp may use the wrong NIC. Set this to force a specific
# interface, e.g. "ip=eno8303:dhcp" for C6620 Embedded NIC.
# Leave empty to use the global bss_ip_param for all groups.
bss_ip_param_compute: ""
