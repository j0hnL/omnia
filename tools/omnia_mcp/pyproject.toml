[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-mcp"
version = "0.1.0"
description = "MCP server for AI-assisted Dell Omnia cluster configuration management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "mcp>=1.0.0",
    "ruamel.yaml>=0.18.0",
    "PyYAML>=6.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
sse = [
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
omnia-mcp = "omnia_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["omnia_mcp*"]
